apis:
- name: WAX Chain API (Antelope RPC)
  description: >-
    Public Antelope/EOSIO Chain API for the WAX blockchain — query chain state
    (get_info, get_account, get_table_rows, get_currency_balance) and submit
    signed transactions (push_transaction/send_transaction). Read endpoints are
    unauthenticated JSON-over-HTTP POST. Served by independent WAX
    infrastructure/block-producer nodes; wax.greymass.com is a documented public
    endpoint.
  humanURL: https://docs.wax.io/
  baseURL: https://wax.greymass.com
  properties:
  - type: Documentation
    url: https://docs.wax.io/
- name: WAX Hyperion History API
  description: >-
    Hyperion full-history API for the WAX chain — query historical actions,
    transactions, and state deltas at /v1/history/* and /v2/*.
  humanURL: https://docs.wax.io/operate/wax-hyperion/wax-running-hyperion
  baseURL: https://wax.eosphere.io
