name: WAX
description: >-
  WAX (Worldwide Asset eXchange) is a purpose-built, carbon-neutral layer-1
  blockchain and protocol token for NFTs, blockchain gaming, and e-commerce,
  built as an Antelope (EOSIO fork) chain. Developers build dApps against the
  public Antelope Chain API (/v1/chain/*) and the Hyperion History API, and
  integrate the WAX Cloud Wallet through the official @waxio JavaScript SDKs
  (waxjs, sdk-react-native). Read RPC endpoints are unauthenticated; state
  changes are authorized by client-side secp256k1 transaction signatures rather
  than API keys or OAuth. WAX also operates microservices such as WAX Cloud
  Wallet, the WAX RNG oracle, and vIRL. Backed by Pantera Capital.
